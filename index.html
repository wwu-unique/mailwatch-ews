<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailwatch</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e4e6ea;--txt:#26313d;--mut:#7a8694;--acc:#2563eb;--accw:#eaf1fe}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:600}
header .stats{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sp{flex:1}
button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--accw);border-color:var(--acc);color:var(--acc)}
main{display:grid;grid-template-columns:minmax(340px,5fr) 7fr;height:calc(100vh - 49px)}
#list{overflow-y:auto;border-right:1px solid var(--line);background:var(--card)}
.row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--accw)}
.row.sel{background:var(--accw);border-left:3px solid var(--acc);padding-left:11px}
.row .sub{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .sub::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:6px}
.row .meta{display:flex;gap:8px;color:var(--mut);font-size:12px;margin-top:2px}
.row .snip{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{overflow-y:auto;padding:20px;max-width:100%}
#detail h2{font-size:18px;margin:0 0 8px}
#detail .hdr{color:var(--mut);font-size:12px;line-height:1.8;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;word-break:break-all}
iframe{width:100%;border:1px solid var(--line);border-radius:6px;min-height:400px;background:#fff}
pre.body{white-space:pre-wrap;font:inherit}
#empty{color:var(--mut);text-align:center;padding-top:120px}
.att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 10px;margin:4px 6px 0 0;font-size:12px;text-decoration:none;color:var(--txt)}
.att:hover{border-color:var(--acc);color:var(--acc)}
.pager{display:flex;gap:8px;justify-content:center;padding:12px}
#login{max-width:320px;margin:15vh auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 4px 18px rgba(20,40,80,.06)}
#login input,#login button{width:100%;margin-top:10px;padding:8px;border-radius:6px;border:1px solid var(--line)}
#login button{background:var(--acc);border-color:var(--acc);color:#fff}
#login h2{margin:0 0 6px;font-size:16px}
.bar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;position:sticky;top:0;background:var(--card)}
.bar input{flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
#mask{position:fixed;inset:0;background:rgba(20,30,45,.4);display:none;align-items:center;justify-content:center;z-index:9}
#dlg{background:var(--card);border-radius:10px;width:min(560px,92vw);max-height:86vh;display:flex;flex-direction:column}
#dlg .hd{padding:14px 18px 6px;font-weight:600}
#dlg .bd{padding:0 18px;overflow-y:auto}
#dlg .ft{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end}
#dlg input,#dlg textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-bottom:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20313f;color:#fff;padding:8px 16px;border-radius:8px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
#replybar{display:flex;gap:8px}
@media(max-width:820px){main{grid-template-columns:1fr}#view{display:none}}
</style>
</head>
<body>

<div id="login" style="display:none">
  <h2>Mailwatch login</h2>
  <div id="lerr" style="color:#c0392b;font-size:12px"></div>
  <input id="lu" placeholder="User" autocomplete="username">
  <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <button onclick="doLogin()">Sign in</button>
</div>

<div id="app" style="display:none;flex-direction:column">
<header>
  <h1>Mailwatch</h1>
  <span class="stats" id="stats"></span>
  <span class="sp"></span>
  <button onclick="openCompose()">Compose</button>
  <button id="mkall" onclick="markAll()">Mark all read</button>
  <button onclick="doLogout()">Exit</button>
</header>
<main>
  <section id="list">
    <div class="bar">
      <input id="q" placeholder="Search subject / body / sender..." onkeydown="if(event.key=='Enter'){load(0)}">
      <button id="unbtn" onclick="toggleUnread(this)">Unread</button>
    </div>
    <div id="rows"></div>
    <div class="pager">
      <button id="prev" onclick="load(cur-1)" disabled>Prev</button>
      <button id="next" onclick="load(cur+1)">Next</button>
    </div>
  </section>
  <section id="view"><div id="empty">Select a message</div><div id="detail" style="display:none"></div></section>
</main>
</div>

<div id="mask"><div id="dlg">
  <div class="hd">Compose message</div>
  <div class="bd">
    <input id="cto" placeholder="To, comma separated">
    <input id="ccc" placeholder="Cc, optional">
    <input id="csu" placeholder="Subject">
    <textarea id="cbo" rows="9" placeholder="Body (plain text)"></textarea>
    <div id="cerr" style="color:#c0392b;font-size:12px"></div>
  </div>
  <div class="ft">
    <button onclick="hideDlg()">Cancel</button>
    <button onclick="send(true)">Dry run</button>
    <button class="pri" onclick="send(false)">Send</button>
  </div>
</div></div>

<div id="toast"></div>

<script>
const T = () => localStorage.getItem('mwtoken') || '';
const H = () => ({'X-Panel-Token': T()});
const $ = id => document.getElementById(id);
const fmtT = s => s ? new Date(s).toLocaleString() : '';
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
let cur=0, onlyUnread=false;

function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2500);}

// ----- auth -----
async function ping(){const r=await fetch('/api/summary',{headers:H()});return r.ok;}
async function doLogin(){
 $('lerr').textContent='';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({username:$('lu').value.trim(),password:$('lp').value})});
  const j=await r.json();
  if(!r.ok||!j.ok||!j.token)throw new Error(j.error||'login failed');
  localStorage.setItem('mwtoken',j.token);boot();
 }catch(e){$('lerr').textContent=e.message||String(e);}
}
async function doLogout(){
 try{await fetch('/api/logout',{method:'POST',headers:H()});}catch(e){}
 localStorage.removeItem('mwtoken');$('app').style.display='none';$('login').style.display='block';
}

// ----- list -----
async function load(pg){
 cur=Math.max(0,pg);
 const term=$('q').value.trim();
 const url=`/api/mails?limit=50&offset=${cur*50}`+(term?`&q=${encodeURIComponent(term)}`:'');
 const r=await fetch(url,{headers:H()});
 if(!r.ok){toast('load failed: '+r.status);return;}
 const j=await r.json();
 const box=$('rows');box.innerHTML='';
 for(const it of j.items){
  const d=document.createElement('div');
  d.className='row'+(it.is_read?'':' unread');
  d.innerHTML='<div class="sub"></div><div class="meta"><span class="from"></span><span class="tm"></span></div><div class="snip"></div>';
  d.querySelector('.sub').textContent=it.subject||'(no subject)';
  d.querySelector('.from').textContent=it.sender_name||it.sender||it.sender_email||'';
  d.querySelector('.tm').textContent=fmtT(it.time);
  d.querySelector('.snip').textContent=it.snippet||'';
  d.onclick=()=>view(it.key,d);
  if(onlyUnread&&it.is_read)d.style.display='none';
  box.appendChild(d);
 }
 $('prev').disabled=cur===0;
 $('next').disabled=(cur+1)*50>=j.total;
}
function toggleUnread(btn){
 onlyUnread=!onlyUnread;
 btn.classList.toggle('on',onlyUnread);
 [...$('rows').children].forEach(n=>{if(!n.classList.contains('unread'))n.style.display=onlyUnread?'none':'';});
}

// ----- detail -----
async function view(key,row){
 [...document.querySelectorAll('.row.sel')].forEach(n=>n.classList.remove('sel'));
 if(row)row.classList.add('sel');
 const r=await fetch('/api/mail/'+key,{headers:H()});
 if(!r.ok){toast('open failed: '+r.status);return;}
 const m=await r.json();
 $('empty').style.display='none';
 const det=$('detail');det.style.display='block';
 const atts=(m.attachment_items||[]).map(a=>
   `<a class="att" href="/api/att/${key}/${a.id}?token=${encodeURIComponent(T())}" target="_blank" rel="noopener">${esc(a.filename||'(file)')} (${Math.ceil((a.size||0)/1024)}KB)</a>`).join('');
 function close(){det.innerHTML='<div id="empty" style="display:none"></div>';}
 const html=m.body_html?`<iframe sandbox="" id="bd"></iframe>`:`<pre class="body"></pre>`;
 det.innerHTML=`<div id="replybar"><button id="rreply" style="display:none">Reply</button></div>
   <h2 class="sj"></h2>
   <div class="hdr"></div><div class="attlers"></div>${html}`;
 det.querySelector('.sj').textContent=m.subject||'(no subject)';
 det.querySelector('.hdr').innerHTML=
   `From: ${esc((m.sender_name||'')+(m.sender_email?` <${m.sender_email}>`:''))}<br>`+
   `To: ${esc((m.recipients||[]).join(', '))}`+
   (m.cc&&m.cc.length?`<br>Cc: ${esc(m.cc.join(', '))}`:'')+
   `<div>${fmtT(m.datetime_received||m.datetime_sent)}</div>`;
 det.querySelector('.attlers').innerHTML=atts;
 if(m.body_html){
  const f=det.querySelector('#bd');f.srcdoc=m.body_html;
  f.onload=()=>{try{f.style.height=(f.contentDocument.body.scrollHeight+24)+'px'}catch(e){}};
 }else{
  det.querySelector('pre.body').textContent=m.body_text||'(empty)';
 }
 const rb=det.querySelector('#rreply');
 rb.style.display='';
 rb.onclick=()=>openReply(m.key,m);
 fetch('/api/mail/'+key+'/read',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:'{"read":true}'})
   .then(()=>{if(row)row.classList.remove('unread')});
}

// ----- compose -----
function openCompose(){mask.style.display='flex';cerr.textContent='';cto.value=ccc.value=csu.value=cbo.value='';$('dlg').dataset.key='';}
function openReply(key,m){
 mask.style.display='flex';cerr.textContent='';
 cto.value=(m.sender_email||'');ccc.value='';
 csu.value=(m.subject||'').startsWith('Re:')?m.subject:'Re: '+(m.subject||'');
 cbo.value='\n\n----- Original -----\nFrom: '+(m.sender_name||m.sender_email||'')+'\nDate: '+
   fmtT(m.datetime_received)+'\n\n'+(m.body_text||'');
 $('dlg').dataset.key=String(key);
}
function hideDlg(){$('mask').style.display='none';}
class SendErr extends Error{}
async function send(dry){
 try{
  const toL=cbo2list($('cto').value), ccL=cbo2list($('ccc').value);
  if(!toL.length&&!ccL.length)throw new SendErr('no recipient');
  if(!$('csu').value.trim())throw new SendErr('subject required');
  const mask0=($('dlg').dataset.key||'');
  const payload=(mask0?{action:'reply'}:{action:'new'});
  Object.assign(payload,{key:mask0?parseInt(mask0,10):undefined,to:toL,cc:ccL.length?ccL:undefined,
    subject:$('csu').value.trim(),body:$('cbo').value,dry_run:dry});
  const r=await fetch('/api/send',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json();
  if(!r.ok){throw new SendErr((j.error||'send failed'));}
  toast(dry?'Dry run OK':'Sent');
  hideDlg();
  load(0);
 }catch(e){
  cerr.textContent=e.message||String(e);
 }
}

// fixed: name
function cbo2list(raw){
 return raw.split(',').map(s=>s.trim()).filter(Boolean);
}

async function markAll(){
 try{
  const r=await fetch('/api/mails/read',{method:'POST',headers:H()});
  const j=await r.json();
  toast('marked '+ (j.updated??0) +' read');
 }catch(e){toast('mark-all failed');}
 load(0);refreshSummary();
}

// ----- status / boot -----
async function refreshSummary(){
 try{
  const r=await fetch('/api/summary',{headers:H()});
  if(!r.ok)return;
  const s=await r.json();
  const lig=s.source_ok?'●':'○';
  let t=`${lig} ${s.mailbox||''}`;
  t+=`  total ${s.total} | unread ${s.unread} | attachments ${s.attachments}`;
  if(s.latest_time)t+=` | latest ${fmtT(s.latest_time)}`;
  if(s.last_error)t+=` | ERROR: ${s.last_error}`;
  $('stats').textContent=t;
  $('stats').title=t;
 }catch(e){}
}

async function boot(){
 if(!(await ping())){localStorage.removeItem('mwtoken');$('app').style.display='none';$('login').style.display='block';return;}
 $('login').style.display='none';
 $('app').style.display='flex';
 load(0);refreshSummary();
 if(window.__hid)clearInterval(window.__hid);
 window.__hid=setInterval(refreshSummary,15000);
}

window.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
